# Builds the signed Android APK and attaches it to a GitHub release.
#
# Runs when a version tag such as v1.0.1 is pushed. To build a tag that already
# exists, use "Run workflow" on the Actions tab and enter the tag.
#
# If the tag has no release yet, this creates a draft to review and publish.
# The app only offers updates from published releases, never from drafts.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   EXPENSES_KEYSTORE_BASE64        The release keystore, base64-encoded
#   EXPENSES_UPLOAD_KEY_ALIAS       Key alias inside the keystore
#   EXPENSES_UPLOAD_STORE_PASSWORD  Keystore password
#   EXPENSES_UPLOAD_KEY_PASSWORD    Key password
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, such as v1.0.1
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expensesapp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Check the tag matches versionName in build.gradle
        run: |
          version=$(sed -n 's/^ *versionName "\(.*\)"/\1/p' android/app/build.gradle)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match versionName $version in android/app/build.gradle"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The default "enhanced" cache is a proprietary component; basic is MIT-licensed.
          cache-provider: basic

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EXPENSES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The EXPENSES_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the release APK
        working-directory: expensesapp/android
        env:
          ORG_GRADLE_PROJECT_EXPENSES_UPLOAD_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_EXPENSES_UPLOAD_KEY_ALIAS: ${{ secrets.EXPENSES_UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_EXPENSES_UPLOAD_STORE_PASSWORD: ${{ secrets.EXPENSES_UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_EXPENSES_UPLOAD_KEY_PASSWORD: ${{ secrets.EXPENSES_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the APK after the version
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/dist/expense-planner-$VERSION.apk"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: ${{ runner.temp }}/dist/*.apk
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - name: Create the release if needed and upload
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Version ${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" dist/*.apk --clobber
